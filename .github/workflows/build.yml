name: Build TV app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Signing key
        env: { KEYSTORE_B64: '${{ secrets.KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mytv.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/mytv.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        env: { KEYSTORE_PASS: '${{ secrets.KEYSTORE_PASS }}' }
        run: gradle :app:assembleRelease --no-daemon
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/outputs/apk/release/app-release.apk my-tv.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest my-tv.apk --title "شاشتي (آخر نسخة)" --notes "نزّلها على التلفزيون من تطبيق Downloader"
